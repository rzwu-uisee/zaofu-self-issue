apiVersion: zaofu.dev/v1
kind: PrdFlow
metadata:
  name: prd-fanout-oa-pilot/v3
spec:
  lanes: 2
  backend: codex
  roleDefaults:
    model_reasoning_effort: high
  prdRef: docs/prd/TODO.md
  targetRoot: app
  qualityFloor: product-demo
  evidencePolicy: strict_refs
  deliveryPolicy: ship_candidate
  artifactPackageMode: blocking
  semanticSubmitProfiles:
    workflow-read: blocking
    plan-synth: blocking
    implementation: blocking
    task-verify: blocking
    candidate-verify: blocking
    thin-judge-goal-closure: blocking
---
apiVersion: zaofu.dev/v1
kind: ZfConfig
metadata:
  name: prd-fanout-v3-oa-pilot
  zaofu:
    catalog:
      id: prd-fanout-v3-oa-pilot-codex
      label: PRD Fanout v3 OA Pilot
      description: PRD pilot with one blocking OA plan-candidate checkpoint.
      intent: build
      backend: codex
      roles: 11
      recommended_for: [build, pilot]
      preferred: false
      order: 39
spec:
  profile_sources: [common/profiles.yaml]
  uses: [prod-runtime/v1]
  version: "1.0"
  project:
    name: prd-fanout-v3-oa-pilot
  orchestrator:
    backend: codex
    wake_min_interval_s: 5
  roles:
    - name: orchestrator
      instance_id: orchestrator
      role_kind: reader
      backend: codex
      model_reasoning_effort: high
      permission_mode: bypass
      transport: tmux
      execution:
        default_profile: bounded-direct-v1
        profile_allowlist: [bounded-direct-v1]
      lifecycle:
        mode: resident
      stuck_threshold_seconds: 900
      spawn_ready_timeout_seconds: 240
      triggers:
        - dispatch.silent_stall
        - orchestrator.rework.triage.requested
        - orchestrator.semantic.checkpoint.requested
      publishes: [orchestrator.rework.triage.recorded]
      skills: [zf-yoke-orchestrator-role-context, zf-harness-state-sync]
  runtime:
    git:
      auto_ship_on_judge_passed: true
  workflow:
    orchestration:
      mode: exception_advisor
      max_plan_revisions: 2
      no_progress_limit: 2
      flow_policies:
        prd:
          mode: semantic_control
          pilot_id: prd-plan-candidate-v1
          checkpoints:
            - plan_candidate
          checkpoint_policies:
            plan_candidate: blocking
        research:
          mode: exception_advisor
        workflow:
          mode: exception_advisor
    kind_routes:
      prd:
        pattern_id: prd-scan
        default_tier: standard
    dag:
      external_triggers: [prd.requested]
    admission_replan:
      enabled: true
      resynth_trigger: prd.scan.completed
    rework_routing:
      prd.scan.failed: planner
      prd.plan.failed: planner
      integration.failed: planner
      static_gate.failed: dev-lane-0
      test.failed: dev-lane-0
